<div class="form-horizontal">
	<div class="legend" data-i18n="SETTINGS_SECURITY/LEGEND_SECURITY"></div>
	<div class="control-group">
		<label data-i18n="SETTINGS_SECURITY/LABEL_AUTOLOGOUT"></label>
		<div data-bind="component: {
			name: 'Select',
			params: {
				options: autoLogoutOptions,
				value: autoLogout,
				trigger: autoLogoutTrigger,
				optionsText: 'name',
				optionsValue: 'id'
			}
		}"></div>
	</div>
	<div class="control-group">
		<label data-i18n="SETTINGS_SECURITY/FORGET_KEY_PASS"></label>
		<div data-bind="component: {
			name: 'Select',
			params: {
				options: autoLogoutOptions,
				value: keyPassForget,
				trigger: keyPassForgetTrigger,
				optionsText: 'name',
				optionsValue: 'id'
			}
		}"></div>
	</div>
</div>

<div class="encryption-summary" data-bind="css: encryptionStatusClass">
	<div class="encryption-mark fontastic">🔒</div>
	<div class="encryption-copy">
		<div class="encryption-title">Encryption</div>
		<div class="encryption-meta" data-bind="text: encryptionSummary"></div>
	</div>
	<div class="encryption-state" data-bind="text: encryptionStatus"></div>
</div>
