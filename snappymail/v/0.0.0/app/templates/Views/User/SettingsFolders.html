<div class="legend">
	<span data-i18n="SETTINGS_FOLDERS/LEGEND_FOLDERS"></span>
	&nbsp;&nbsp;&nbsp;
	<i class="icon-spinner" style="margin-top: 5px" data-bind="visible: loading"></i>
</div>

<div style="margin-bottom:20px;">
	<div data-bind="component: {
		name: 'Checkbox',
		params: {
			label: 'SETTINGS_FOLDERS/HIDE_UNSUBSCRIBED',
			value: hideUnsubscribed
		}
	}"></div>
	<p class="help-block" data-i18n="SETTINGS_FOLDERS/HIDE_UNSUBSCRIBED_DESC"></p>
</div>

<!-- ko if: showKolab -->
<div style="margin-bottom:20px;" data-bind="component: {
	name: 'Checkbox',
	params: {
		label: 'SETTINGS_FOLDERS/UNHIDE_KOLAB_FOLDERS',
		value: unhideKolabFolders
	}
}"></div>
<!-- /ko -->

<a class="btn" data-bind="click: createFolder">
	<i class="icon-folder-add"></i>
	<span data-i18n="SETTINGS_FOLDERS/BUTTON_CREATE"></span>
</a>
&nbsp;&nbsp;
<a class="btn" data-bind="click: systemFolder" data-icon="🔧" data-i18n="SETTINGS_FOLDERS/BUTTON_SYSTEM"></a>

<div class="legend" data-i18n="SETTINGS_FOLDERS/SMART_ARCHIVE"></div>
<p data-i18n="SETTINGS_FOLDERS/SMART_ARCHIVE_DESC"></p>
<div style="margin-bottom:20px;">
	<div data-bind="component: {
		name: 'Checkbox',
		params: {
			label: 'SETTINGS_FOLDERS/SMART_ARCHIVE_ENABLE',
			value: smartArchiveEnabled
		}
	}"></div>
	<p class="help-block">
		<i class="icon-spinner" data-bind="visible: smartArchiveSetupLoading"></i>
		<span data-i18n="SETTINGS_FOLDERS/SMART_ARCHIVE_ENABLE_DESC"></span>
	</p>
</div>

<!-- ko if: smartArchiveEnabled -->
<div class="legend category-routing-title" data-i18n="SETTINGS_FOLDERS/CATEGORY_ROUTING"></div>
<p data-i18n="SETTINGS_FOLDERS/CATEGORY_ROUTING_DESC"></p>
<button class="btn" data-bind="click: autoConfigureCategoryFolders, disable: categorySetupLoading">
	<i class="icon-spinner" data-bind="visible: categorySetupLoading"></i>
	<span data-i18n="SETTINGS_FOLDERS/CATEGORY_SETUP_BUTTON"></span>
</button>
<table class="table category-routing-list">
	<tbody data-bind="foreach: categoryRoutes">
		<tr>
			<th><span data-bind="text: icon"></span> <span data-bind="text: label"></span></th>
			<td>
				<select data-bind="options: $root.categoryFolderOptions,
					optionsText: 'name', optionsValue: 'id', value: folder,
					optionsAfterRender: $root.defaultOptionsAfterRender"></select>
			</td>
		</tr>
	</tbody>
</table>
<!-- /ko -->

<div class="alert folders-list-error" data-bind="visible: folderListOptimized">
	<b data-i18n="SETTINGS_FOLDERS/TO_MANY_FOLDERS_DESC_1"></b>
	<br>
	<span data-i18n="SETTINGS_FOLDERS/TO_MANY_FOLDERS_DESC_2"></span>
</div>
<div class="alert folders-list-error" data-bind="visible: '' !== folderListError()">
	<a href="#" class="close" data-bind="click: hideError">×</a>
	<span data-bind="text: folderListError"></span>
</div>
<table class="table table-hover list-table" data-bind="i18nUpdate: folderList">
	<tbody data-bind="template: { name: 'SettingsFolderItem', foreach: folderList }"></tbody>
</table>
