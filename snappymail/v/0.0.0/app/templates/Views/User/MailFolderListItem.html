<li>
	<a data-bind="dropmessages: $data,
	   css: { 'selected': selected() && !isSystemFolder(), 'system': isSystemFolder, 'selectable': canBeSelected, 'unread-sub': hasUnreadInSub, 'anim-action-class': actionBlink },
	   attr: { 'data-unread': unreadCount, href: href }">
		<i data-bind="css: collapsedCss()"></i>
		<!-- ko text: name --><!-- /ko -->
	</a>
	<button type="button" class="folder-tree-read" data-bind="visible: hasUnreadInSub() &amp;&amp; !canBeSelected(),
		click: $root.markFolderTreeRead, clickBubble: false,
		disable: $root.markingFolderTree,
		css: {'is-loading': $root.markingFolderTree() === fullName},
		attr: {'aria-label': $root.markSubfoldersReadLabel}"
		data-i18n="[title]FOLDER_LIST/MARK_SUBFOLDERS_READ">✓</button>
	<!-- ko if: hasVisibleSubfolders -->
	<ul data-bind="template: { name: 'MailFolderListItem', foreach: visibleSubfolders }, css: { 'collapsed': collapsed() }"></ul>
	<!-- /ko -->
</li>
