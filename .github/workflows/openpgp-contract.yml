name: OpenPGP contracts

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: [self-hosted, Linux, ARM64, leopere, local]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build browser assets without an availability gap
        run: npm run test:static-build
      - name: Lint
        run: npm run check
      - name: Run OpenPGP contracts
        run: npm run test:openpgp
